[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonics-optimization"
version = "0.2.0"
description = "Synthetic photonics optimization prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.scripts]
photonics-analyze = "photonics_optimization.data:main"
photonics-demo = "photonics_optimization.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
