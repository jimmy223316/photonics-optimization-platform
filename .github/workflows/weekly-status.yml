name: Weekly status
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -e .
      - name: Run tests
        run: python -m pytest --junitxml=artifacts/pytest.xml
      - name: Generate report from observed tests
        if: always()
        run: python scripts/weekly_report.py
      - name: Generate synthetic example
        run: python -m photonics_optimization.demo --output artifacts/demo
      - name: Publish job summary
        if: always()
        run: cat artifacts/weekly-status.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-status-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
