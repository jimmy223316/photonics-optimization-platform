name: Optional Meep FDTD
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  meep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment-meep.yml
          activate-environment: photonics-meep
          use-mamba: true
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Actual solver integration tests
        run: RUN_MEEP_TESTS=1 python -m pytest tests/test_meep_backend.py --junitxml=artifacts/meep-tests.xml
      - name: Tutorial parameter reproduction with output transmission
        run: python -m photonics_optimization.meep_sweep --diagnostics-only --output artifacts/meep-tutorial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-meep-2d-${{ github.run_id }}
          path: artifacts/
